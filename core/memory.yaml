version: 0.1
memory:
  scopes:
    agency: {contains: [framework_rules,global_playbooks,tool_knowledge]}
    client: {contains: [brand,offer,products,audience,policies,credentials_refs]}
    campaign: {contains: [hypotheses,assets,decisions,results]}
    agent: {contains: [role_specific_learnings,verified_patterns]}
    job: {contains: [inputs,decisions,evidence,outputs]}
  rules:
