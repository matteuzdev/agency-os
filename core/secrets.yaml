version: 0.1
rules:
  - secret_values_never_enter_persona_or_long_term_memory
  - agents_receive_secret_references_not_secret_values
  - connector_runtime_resolves_secret_reference
  - credentials_are_scoped_per_client_and_provider
  - rotate_and_revoke_without_editing_agent_definitions
references:
  format: "secret://<client>/<provider>/<credential>"
audit: [created,used,rotated,revoked]
