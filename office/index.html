<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agency OS — Living Office</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e8eefc;font-family:Inter,system-ui,sans-serif;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:1fr 340px}.office{position:relative;background:linear-gradient(#121a30 1px,transparent 1px),linear-gradient(90deg,#121a30 1px,transparent 1px),#0d1426;background-size:32px 32px;overflow:auto}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 18px;background:#0b1020dd;backdrop-filter:blur(10px);border-bottom:1px solid #25304c}.brand{font-weight:800}.live{font-size:12px;padding:5px 9px;border:1px solid #2c9a68;border-radius:999px;color:#75e6ad}.floor{min-width:950px;min-height:720px;padding:30px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.dept{border:1px solid #263454;background:#111a31cc;border-radius:16px;padding:14px;min-height:205px}.dept h3{margin:0 0 12px;font-size:13px;color:#8fa5d7}.agent{display:flex;align-items:center;gap:10px;padding:9px;border-radius:10px;cursor:pointer;margin:5px 0;background:#16213d;border:1px solid transparent}.agent:hover,.agent.active{border-color:#6d8cff;background:#1a2850}.avatar{width:34px;height:34px;border-radius:8px;background:#27385f;display:grid;place-items:center;font-weight:800}.meta{min-width:0}.name{font-weight:700;font-size:13px}.task{font-size:11px;color:#94a3c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:145px}.dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#667085}.working .dot{background:#47d18c;box-shadow:0 0 10px #47d18c}.waiting .dot{background:#f0b44c}.side{border-left:1px solid #25304c;background:#0d1426;display:flex;flex-direction:column}.panel{padding:16px;border-bottom:1px solid #25304c}.panel h2{font-size:14px;margin:0 0 8px}.selected{font-size:12px;color:#9db0d8}.feed{flex:1;overflow:auto;padding:14px}.log{padding:9px 0;border-bottom:1px solid #1d2944;font-size:12px}.log b{color:#a8baff}.time{color:#657598;font-size:10px}.chat{padding:12px;border-top:1px solid #25304c}.chatrow{display:flex;gap:7px}.chat input{flex:1;background:#111b33;border:1px solid #2a395e;color:white;border-radius:9px;padding:10px;outline:none}.chat button{background:#6d8cff;color:white;border:0;border-radius:9px;padding:0 13px;font-weight:700;cursor:pointer}.hint{font-size:10px;color:#657598;margin-top:7px}.orion{grid-column:span 4;border-color:#40578e;background:#14203d}.handoff{color:#f0b44c}
</style></head><body><div class="app"><main class="office"><div class="top"><span class="brand">AGENCY OS · LIVING OFFICE</span><span class="live">● LIVE SIMULATION</span><span id="focus" style="margin-left:auto;font-size:12px;color:#91a4cc">Clique em um agente para conversar</span></div><div class="floor" id="floor"></div></main><aside class="side"><div class="panel"><h2 id="who">Orion · Chief Orchestrator</h2><div class="selected" id="role">Coordena a empresa e faz handoffs entre especialistas.</div></div><div class="feed" id="feed"></div><div class="chat"><div class="chatrow"><input id="msg" placeholder="Fale com o agente selecionado..."><button id="send">Enviar</button></div><div class="hint">MVP local: mensagens viram eventos/handoffs. Próxima etapa conecta este canal ao runtime real.</div></div></aside></div>
<script>
const teams=[
{dept:"Direção",agents:[["Orion","Chief Orchestrator","Revisando jobs e delegações","working"]]},
{dept:"Estratégia",agents:[["Maya","Strategy Lead","Planejando cliente Rafaelly","working"],["Iris","Market Research","Pesquisando mercado","working"],["Victor","Offer Strategist","Aguardando pesquisa","waiting"]]},
{dept:"Conteúdo",agents:[["Luna","Content Lead","Montando estratégia editorial","working"],["Nina","Social Media","Preparando calendário","working"],["Leo","Copywriter","Escrevendo hooks","working"],["Mia","Creative Producer","Aguardando briefing","waiting"]]},
{dept:"Growth",agents:[["Atlas","Growth Lead","Analisando aquisição","working"],["Gaia","Local SEO","Auditando presença local","working"],["Hugo","SEO","Mapeando buscas","working"],["Max","Paid Traffic","Aguardando aprovação","waiting"]]},
{dept:"Web",agents:[["Noah","Web Lead","Desenhando jornada","working"],["Wally","WordPress Architect","Planejando stack","working"],["Piper","WP Engineer","Aguardando arquitetura","waiting"]]},
{dept:"Vendas",agents:[["Clara","Sales & CRM Lead","Definindo pipeline","working"],["Marco","Sales Agent","Aguardando leads","waiting"],["Emma","CRM Operator","Preparando CRM","working"]]},
{dept:"IA & Automação",agents:[["Ada","AI Lead","Desenhando automações","working"],["Grace","Automation Architect","Mapeando workflow","working"],["Linus","Integration Engineer","Checando connectors","working"]]},
{dept:"Infraestrutura",agents:[["Bruno","VPS Lead","Monitorando infraestrutura","working"],["Cesar","FinOps","Calculando custos","working"],["Tenant","Multi-Tenant Architect","Validando isolamento","working"]]},
{dept:"Qualidade",agents:[["Vera","QA Lead","Revisando entregas","working"],["Hope","Risk Controller","Approval Gate ativo","working"],["Quinn","Marketing QA","Aguardando entregas","waiting"]]}
];
let selected={name:"Orion",role:"Chief Orchestrator"};const floor=document.querySelector("#floor"),feed=document.querySelector("#feed");
function addLog(text,cls=""){const d=document.createElement("div");d.className="log "+cls;d.innerHTML='<span class="time">'+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+'</span><br>'+text;feed.prepend(d)}
teams.forEach((t,i)=>{const box=document.createElement("section");box.className="dept "+(i===0?"orion":"");box.innerHTML="<h3>"+t.dept.toUpperCase()+"</h3>";t.agents.forEach(a=>{const el=document.createElement("div");el.className="agent "+a[3];el.innerHTML='<div class="avatar">'+a[0][0]+'</div><div class="meta"><div class="name">'+a[0]+'</div><div class="task">'+a[2]+'</div></div><i class="dot"></i>';el.onclick=()=>{document.querySelectorAll(".agent").forEach(x=>x.classList.remove("active"));el.classList.add("active");selected={name:a[0],role:a[1]};who.textContent=a[0]+" · "+a[1];role.textContent=a[2];focus.textContent="Conversando com "+a[0];addLog("<b>Você entrou na mesa de "+a[0]+".</b>")};box.appendChild(el)});floor.appendChild(box)});
function send(){const input=document.querySelector("#msg"),v=input.value.trim();if(!v)return;addLog("<b>Você → "+selected.name+":</b> "+v);if(selected.name!=="Orion" && /orion|equipe|deleg|passa|handoff/i.test(v)){addLog("<b>"+selected.name+" → Orion:</b> Handoff solicitado para coordenação.","handoff")}else{addLog("<b>"+selected.name+":</b> Recebi. Registrei como solicitação no escritório. <span class='handoff'>[MVP: aguardando runtime real]</span>")}input.value=""}
send.onclick=send;msg.addEventListener("keydown",e=>{if(e.key==="Enter")send.click()});
addLog("<b>Orion:</b> Escritório iniciado. Cliente demo Rafaelly está em operação.");addLog("<b>Vera:</b> Approval Gate ativo. WRITE/PUBLISH/SPEND bloqueados sem aprovação.");
</script></body></html>
